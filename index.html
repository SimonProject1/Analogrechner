<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analogsignal-Rechner</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;display:flex;justify-content:center;padding:30px}
.container{background:white;padding:25px;border-radius:12px;box-shadow:0 0 15px rgba(0,0,0,.15);width:450px}
h2{text-align:center;color:#0066cc}label{display:block;margin-top:8px;font-weight:bold}input{width:100%;padding:8px;box-sizing:border-box}button{width:100%;padding:12px;background:#0066cc;color:white;border:none;border-radius:5px;margin-top:15px} .result{margin-top:20px;padding:15px;background:#eef7ee;border-left:5px solid green;font-size:20px;text-align:center;font-weight:bold}
</style>
</head>
<body><div class="container"><h2>Analogsignal-Rechner</h2>
<label>Messbereich von</label><input type="number" id="pvMin" value="0">
<label>Messbereich bis</label><input type="number" id="pvMax" value="10">
<label>Einheit</label><input type="text" id="unitPV" value="bar">
<label>Signalbereich von</label><input type="number" id="sigMin" value="4">
<label>Signalbereich bis</label><input type="number" id="sigMax" value="20">
<label>Signaleinheit</label><input type="text" id="unitSig" value="mA">
<label>Prozesswert</label><input type="number" id="processValue" value="6">
<button onclick="berechnen()">Berechnen</button>
<div class="result" id="result">Ergebnis erscheint hier</div></div>
<script>
function berechnen(){let pvMin=parseFloat(document.getElementById('pvMin').value);let pvMax=parseFloat(document.getElementById('pvMax').value);let sigMin=parseFloat(document.getElementById('sigMin').value);let sigMax=parseFloat(document.getElementById('sigMax').value);let value=parseFloat(document.getElementById('processValue').value);let unitPV=document.getElementById('unitPV').value;let unitSig=document.getElementById('unitSig').value;let result=sigMin+((value-pvMin)/(pvMax-pvMin))*(sigMax-sigMin);document.getElementById('result').innerHTML=value.toFixed(2)+' '+unitPV+' entsprechen<br><br>'+result.toFixed(3)+' '+unitSig;}
</script></body></html>
